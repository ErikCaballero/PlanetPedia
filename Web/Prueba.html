<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    .contenedor-completo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      font-family: sans-serif;
    }

    .bloque-dificultad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .dificultad-barra {
      display: flex;
      gap: 6px;
      background: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
    }

    .segmento {
      width: 25px;
      height: 10px;
      background: #333;
      border-radius: 2px;
      transition: background 0.3s ease;
    }

    .texto-nivel {
      font-weight: bold;
      font-size: 1.1rem;
      transition: color 0.3s ease;
    }

    #icono-dificultad {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="contenedor-completo">
    <div class="bloque-dificultad">
      <div class="dificultad-barra" id="barra">
        <div class="segmento"></div>
        <div class="segmento"></div>
        <div class="segmento"></div>
        <div class="segmento"></div>
        <div class="segmento"></div>
        <div class="segmento"></div>
        <div class="segmento"></div>
        <div class="segmento"></div>
      </div>
      <span id="texto-dificultad" class="texto-nivel"></span>
    </div>
    <img id="icono-dificultad" src="" alt="Icono">
  </div>

  <script>
    const configuracion = {
      1: { texto: "Muy fácil", icono: "https://genesistoxical.com/wp-content/uploads/2021/05/Dibujo_de_calavera_animada_png.png" },
      2: { texto: "Fácil", icono: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7KuYLac7FMhahoJZvZYeAN7YJxtiLe0NsOKkjPihqRg&s=10" },
      3: { texto: "Medio", icono: "medio.png" },
      4: { texto: "Alto", icono: "alto.png" },
      5: { texto: "Muy alto", icono: "calavera.png" },
      6: { texto: "Difícil", icono: "https://stickerapp.es/cdn-assets/images/preview/2015/09/19/design-4968/template-sticker-300x300.png" },
      7: { texto: "Extremo", icono: "extremo.png" },
      8: { texto: "Imposible", icono: "imposible.png" }
    };

    function actualizarDificultad(nivel) {
      const segmentos = document.querySelectorAll('.segmento');
      const texto = document.getElementById('texto-dificultad');
      const img = document.getElementById('icono-dificultad');

      // Colores: 1-3 Verde, 4-6 Amarillo, 7-8 Rojo
      let color = nivel <= 3 ? '#2ecc71' : (nivel <= 6 ? '#f1c40f' : '#e74c3c');

      segmentos.forEach((seg, index) => {
        seg.style.background = index < nivel ? color : '#333';
      });

      texto.innerText = configuracion[nivel].texto;
      texto.style.color = color;
      img.src = configuracion[nivel].icono;
    }

    // Ejemplo: Llama a esta función para cambiar el nivel (del 1 al 8)
    actualizarDificultad(2);
  </script>

</body>
</html>
