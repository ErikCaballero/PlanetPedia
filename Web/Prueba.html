<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Base de Datos Extraterrestre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
  body {
  background-color: #0b0f19;
  color: #fff;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.card-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.selector button {
  background: #161f33;
  border: 1px solid #00ffcc;
  color: #00ffcc;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s ease;
}

.selector button:hover {
  background: #00ffcc;
  color: #0b0f19;
  box-shadow: 0 0 10px #00ffcc;
}

.alien-card {
  background: #111827;
  border: 2px solid #1f293d;
  border-radius: 16px;
  padding: 24px;
  width: 300px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.alien-card img {
  width: 140px;
  height: 140px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #00ffcc;
  margin-bottom: 12px;
}

.planet {
  color: #9ca3af;
  font-size: 0.9em;
  margin-top: -10px;
}

/* Barras de Estadísticas */
.stats {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.stat {
  text-align: left;
  font-size: 0.85em;
}

.bar-bg {
  background: #1f293d;
  height: 12px;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 4px;
}

.bar-fill {
  height: 100%;
  width: 0%; /* Inicia en 0 para ser animado por JS */
  background: linear-gradient(90deg, #00ffcc, #00b8ff);
  border-radius: 6px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
</style>
  <div class="card-container">
    <div class="selector">
      <button onclick="mostrarAlien('xenomorfo')">Xenomorfo</button>
      <button onclick="mostrarAlien('zorg')">Zorg</button>
      <button onclick="mostrarAlien('pyro')">Pyrosiano</button>
    </div>

    <div class="alien-card" id="alienCard">
      <img id="alienImage" src="" alt="Alien">
      <h2 id="alienName">Selecciona un Alien</h2>
      <p id="alienPlanet" class="planet"></p>

      <div class="stats">
        <div class="stat">
          <span>Fuerza</span>
          <div class="bar-bg"><div class="bar-fill" id="statFuerza"></div></div>
        </div>
        <div class="stat">
          <span>Agilidad</span>
          <div class="bar-bg"><div class="bar-fill" id="statAgilidad"></div></div>
        </div>
        <div class="stat">
          <span>Inteligencia</span>
          <div class="bar-bg"><div class="bar-fill" id="statInteligencia"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
<script>
  const alienData = {
  xenomorfo: {
    nombre: "Xenomorfo Prime",
    planeta: "Origen: LV-426",
    imagen: "https://placehold.co/150x150/000/00ffcc?text=Xeno",
    fuerza: 95,
    agilidad: 85,
    inteligencia: 60
  },
  zorg: {
    nombre: "Zorg El Viscoso",
    planeta: "Origen: Neptuno B",
    imagen: "https://placehold.co/150x150/000/00b8ff?text=Zorg",
    fuerza: 40,
    agilidad: 50,
    inteligencia: 98
  },
  pyro: {
    nombre: "Ignis Pyros",
    planeta: "Origen: Solis-9",
    imagen: "https://placehold.co/150x150/000/ff5500?text=Pyro",
    fuerza: 80,
    agilidad: 70,
    inteligencia: 75
  }
};

function mostrarAlien(id) {
  const alien = alienData[id];

  // Actualizar textos e imagen
  document.getElementById("alienName").innerText = alien.nombre;
  document.getElementById("alienPlanet").innerText = alien.planeta;
  document.getElementById("alienImage").src = alien.imagen;

  // Actualizar ancho de barras de stats
  document.getElementById("statFuerza").style.width = alien.fuerza + "%";
  document.getElementById("statAgilidad").style.width = alien.agilidad + "%";
  document.getElementById("statInteligencia").style.width = alien.inteligencia + "%";
}

// Cargar el primero por defecto
mostrarAlien("xenomorfo");
</script>
</html>
